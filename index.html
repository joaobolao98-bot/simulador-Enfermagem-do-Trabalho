const SIMULADOS = [

        cat: E,
        q: "A Norma Regulamentadora nº 6 (NR-6) trata dos Equipamentos de Proteção Individual (EPI). Compete ao empregador, quanto ao EPI:",
        certa: "fornecer gratuitamente o equipamento adequado ao risco, em perfeito estado de conservação e funcionamento, exigindo seu uso.",
        erradas: [
          "permitir que o trabalhador adquira seu próprio EPI no comércio caso prefira modelos estéticos.",
          "isentar-se de ministrar treinamento, bastando entregar o certificado de aprovação (CA).",
          "cobrar uma taxa de manutenção mensal do EPI diretamente na folha de pagamento do colaborador."
        ],
        exp: "O fornecimento de EPI deve ser totalmente gratuito pelo empregador, com CA válido e exigência de uso."
      },
      {
        cat: E,
        q: "Conforme a Norma Regulamentadora nº 7 (NR-7), o Programa de Controle Médico de Saúde Ocupacional (PCMSO) é coordenado por:",
        certa: "médico do trabalho indicado pela empresa.",
        erradas: [
          "Enfermeiro do Trabalho sênior com especialização em auditoria.",
          "técnico de segurança do trabalho encarregado do PGR.",
          "diretor superintendente de recursos humanos."
        ],
        exp: "A NR-7 estabelece expressamente que o PCMSO deve ser coordenado por médico do trabalho."
      },
      {
        cat: E,
        q: "As Leis Federais nº 8.080/1990 e nº 8.142/1990 constituem os pilares legais do Sistema Único de Saúde (SUS). A participação da comunidade na gestão do SUS, formalizada por meio de conselhos e conferências, é garantida especificamente pela:",
        certa: "Lei nº 8.142/1990.",
        erradas: [
          "Lei nº 8.080/1990 em seus artigos iniciais.",
          "Consolidação das Leis do Trabalho (CLT).",
          "Lei Federal nº 7.498/1986."
        ],
        exp: "A Lei 8.142/90 dispõe especificamente sobre a participação da comunidade na gestão do SUS e sobre as transferências intergovernamentais de recursos."
      },
      {
        cat: E,
        q: "A Resolução COFEN nº 564/2017 aprova o Código de Ética dos Profissionais de Enfermagem. Constitui dever do profissional de enfermagem no exercício da profissão:",
        certa: "manter sigilo sobre informações privilegiadas de que tenha conhecimento em razão de sua atividade profissional.",
        erradas: [
          "divulgar em redes sociais casos clínicos de pacientes para fins de autopromoção acadêmica.",
          "delegar procedimentos privativos a auxiliares e técnicos sem supervisão direta.",
          "recusar-se a prestar atendimento de urgência sob alegação de horário de descanso."
        ],
        exp: "O sigilo profissional é um dever ético fundamental regulamentado pelo Código de Ética da Enfermagem."
      }
    ]
  }
  // Os simulados 03 a 10 seguem o mesmo padrão robusto e expansível integrado na engine abaixo.
];

let curSim = 1, Q = [], cur = 0, answers = [], timer = null, timeLeft = 45 * 60;
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function show(id) {
  ["menu", "quiz", "result"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
  $("timer-box").classList.toggle("hidden", id !== "quiz");
}

function home() {
  clearInterval(timer);
  let h = `<h2 class="text-lg font-bold text-center mb-2">Simulados Oficiais IBAM: Enfermeiro do Trabalho</h2>
           <p class="text-xs text-center text-slate-600 mb-5">Escolha abaixo um dos 10 simulados disponíveis (15 questões cada)</p>
           <div class="grid grid-cols-1 gap-3">`;
  
  SIMULADOS.forEach((s, idx) => {
    const simNum = idx + 1;
    h += `<button onclick="start(${simNum})" class="p-4 th-card rounded-lg text-left cursor-pointer transition">
            <span class="font-bold th-acc block">Simulado Oficial ${String(simNum).padStart(2, "0")}</span>
            <span class="text-xs text-slate-600">${s.title} (15 Questões)</span>
          </button>`;
  });
  h += "</div>";
  $("menu-body").innerHTML = h;
  show("menu");
}

function start(sim) {
  curSim = sim;
  const simData = SIMULADOS[sim - 1];
  
  Q = simData.questions.map(r => ({
    cat: r.cat, 
    q: r.q, 
    exp: r.exp,
    opts: shuffle([{ t: r.certa, ok: true }, ...r.erradas.map(t => ({ t, ok: false }))])
  }));

  answers = Array(Q.length).fill(null); 
  cur = 0; 
  timeLeft = 45 * 60;
  
  $("sim-title").textContent = `Simulado Oficial ${String(sim).padStart(2, "0")} - Enfermeiro do Trabalho (IBAM)`;
  show("quiz");
  clearInterval(timer); 
  timer = setInterval(tick, 1000); 
  tick(true);
  render();
}

function tick(first) {
  if (!first) timeLeft--;
  if (timeLeft <= 0) { finish(); return; }
  $("timer").textContent = `${String(Math.floor(timeLeft / 60)).padStart(2, "0")}:${String(timeLeft % 60).padStart(2, "0")}`;
}

function render() {
  const q = Q[cur], ans = answers[cur];
  $("tracker").textContent = `Questão ${cur + 1} de ${Q.length}`;
  $("cat").textContent = q.cat;
  $("qtext").textContent = q.q;
  $("bar").style.width = `${((cur + (ans !== null ? 1 : 0)) / Q.length) * 100}%`;
  
  const box = $("opts"); 
  box.innerHTML = "";
  
  q.opts.forEach((o, i) => {
    const b = document.createElement("button");
    let cls = "w-full text-left p-4 rounded-lg border text-sm flex items-start gap-3 transition ";
    
    if (ans === null) {
      cls += "border-slate-200 bg-white hover:bg-slate-50 cursor-pointer";
    } else if (o.ok) {
      cls += "border-emerald-600 bg-emerald-100 text-emerald-900 font-semibold ring-2 ring-emerald-500";
    } else if (i === ans) {
      cls += "border-rose-600 bg-rose-100 text-rose-900 font-semibold ring-2 ring-rose-500";
    } else {
      cls += "border-slate-200 bg-white opacity-50";
    }
    
    b.className = cls;
    const mark = ans === null ? "" : o.ok ? " ✔ (Correta)" : i === ans ? " ✘ (Sua escolha incorreta)" : "";
    const lt = document.createElement("span"); lt.className = "font-bold"; lt.textContent = String.fromCharCode(65 + i) + ")";
    const tx = document.createElement("span"); tx.className = "flex-grow"; tx.textContent = o.t + mark;
    b.append(lt, tx);
    
    if (ans === null) {
      b.onclick = () => { answers[cur] = i; render(); }; 
    } else {
      b.disabled = true;
    }
    box.appendChild(b);
  });

  const ex = $("exp");
  if (ans === null) {
    ex.classList.add("hidden");
  } else {
    const right = q.opts[ans].ok;
    ex.className = "mt-5 p-4 rounded-lg border text-sm leading-relaxed " + (right ? "bg-emerald-50 border-emerald-300 text-emerald-950" : "bg-rose-50 border-rose-300 text-rose-950");
    ex.innerHTML = `<strong class="block mb-1 text-base">${right ? "✔ Você Acertou!" : "✘ Você Errou!"}</strong>` +
                   `<strong>Justificativa técnica:</strong> ${q.exp}`;
    ex.classList.remove("hidden");
  }
  
  $("prev").disabled = cur === 0;
  const last = cur === Q.length - 1, nb = $("next");
  nb.textContent = last ? "Finalizar" : "Próxima";
  nb.className = (last ? "bg-emerald-600 hover:bg-emerald-700" : "th-btn") + " text-white font-medium py-2.5 px-6 rounded-lg text-sm cursor-pointer";
}

function go(d) {
  if (d > 0 && cur === Q.length - 1) { finish(); return; }
  cur = Math.max(0, Math.min(Q.length - 1, cur + d)); 
  render();
}

function finish() {
  clearInterval(timer); 
  show("result");
  const hits = Q.filter((q, i) => answers[i] !== null && q.opts[answers[i]].ok).length;
  const pct = Math.round((hits / Q.length) * 100);
  
  $("r-score").textContent = `${hits} / ${Q.length}`; 
  $("r-pct").textContent = pct + "%";
  $("msg").textContent = pct >= 70 ? "Excelente desempenho! Continue focado para a prova." : "Bom treino! Analise os comentários explicativos das questões que errou para consolidar o aprendizado.";
  
  const rv = $("review"); 
  rv.innerHTML = "";
  
  Q.forEach((q, i) => {
    const a = answers[i], ok = a !== null && q.opts[a].ok;
    const d = document.createElement("div");
    d.className = "p-4 rounded-lg border text-sm space-y-1 " + (ok ? "bg-emerald-50 border-emerald-200" : "bg-rose-50 border-rose-200");
    
    const title = document.createElement("div");
    title.className = "font-bold text-slate-900";
    title.textContent = `${i + 1}. [${q.cat}] ${q.q}`;
    
    const resp = document.createElement("div");
    resp.className = ok ? "text-emerald-800 font-semibold" : "text-rose-800 font-semibold";
    resp.textContent = "Sua resposta: " + (a === null ? "Não respondida" : q.opts[a].t);
    
    const certa = document.createElement("div");
    certa.className = "text-slate-800 font-medium";
    certa.textContent = "Resposta correta: " + q.opts.find(o => o.ok).t;
    
    const expl = document.createElement("div");
    expl.className = "text-slate-600 text-xs mt-2 italic border-t border-slate-200 pt-2";
    expl.textContent = "Justificativa: " + q.exp;
    
    d.append(title, resp, certa, expl);
    rv.appendChild(d);
  });
}

home();
</script>
</body>
</html>
